    environment:
      SPRING_APPLICATION_NAME: seminar
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: seminarDb
      DB_USERNAME: root
      DB_PASSWORD: root
      RABBITMQ_HOST: rabbitmq
    healthcheck:
      test: [ "CMD", "sh", "-c", "curl --fail --silent localhost:8082/actuator/health | grep UP || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      - postgres
