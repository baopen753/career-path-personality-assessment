name: career-path-personality-assessment

services:
  eurekaserver:
    container_name: eurekaserver
    build:
      context: ../eureka-server
    ports:
      - "8761:8761"
    environment:
      SPRING_APPLICATION_NAME: "eurekaserver"
      EUREKA_HOSTNAME: "eurekaserver"
    healthcheck:
      test: [ "CMD", "sh", "-c", "curl --fail --silent localhost:8761/actuator/health | grep UP || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - swd392
    restart: on-failure

  gatewayserver:
    container_name: gatewayserver
    build:
      context: ../api-gateway
    ports:
      - "8072:8072"
    environment:
      SPRING_APPLICATION_NAME: gatewayserver
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka
    healthcheck:
      test: [ "CMD", "sh", "-c", "curl --fail --silent localhost:8072/actuator/health | grep UP || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      - eurekaserver
    networks:
      - swd392
    restart: on-failure

  user:
    container_name: user
    build:
      context: ../user-service
    ports:
      - "8080:8080"
    environment:
      SPRING_APPLICATION_NAME: user
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: userDb
      DB_USERNAME: root
      DB_PASSWORD: root
      RABBITMQ_HOST: rabbitmq
    healthcheck:
      test: [ "CMD", "sh", "-c", "curl --fail --silent localhost:8080/actuator/health | grep UP || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      - postgres
      - rabbitmq
      - eurekaserver
    networks:
      - swd392
    restart: on-failure

  notification:
    container_name: notification
    build:
      context: ../notification-service
    ports:
      - "8084:8084"
    environment:
      SPRING_APPLICATION_NAME: notification
      RABBITMQ_HOST: rabbitmq
    healthcheck:
      test: [ "CMD", "sh", "-c", "curl --fail --silent localhost:8084/actuator/health | grep UP || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      - rabbitmq
    networks:
      - swd392
    restart: on-failure

  career:
    container_name: career
    build:
      context: ../career-service
    ports:
      - "8085:8085"
    environment:
      SPRING_APPLICATION_NAME: career
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_DATABASE: careerDb
      MONGODB_USERNAME: root
      MONGODB_PASSWORD: root
      MONGODB_AUTH_DB: admin
    healthcheck:
      test: [ "CMD", "sh", "-c", "curl --fail --silent localhost:8085/actuator/health | grep UP || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      - mongodb
      - eurekaserver
    networks:
      - swd392
    restart: on-failure

  university:
    container_name: university
    build:
      context: ../university-service
    ports:
      - "8081:8081"
    environment:
      SPRING_APPLICATION_NAME: university
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_DATABASE: universityDb
      MONGODB_USERNAME: root
      MONGODB_PASSWORD: root
      MONGODB_AUTH_DB: admin
    healthcheck:
      test: [ "CMD", "sh", "-c", "curl --fail --silent localhost:8081/actuator/health | grep UP || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      - mongodb
      - eurekaserver
    networks:
      - swd392
    restart: on-failure

  quiz:
    container_name: quiz
    build:
      context: ../quiz-service
    ports:
      - "8083:8083"
    environment:
      SPRING_APPLICATION_NAME: quiz
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: quizDb
      DB_USERNAME: root
      DB_PASSWORD: root
    healthcheck:
      test: [ "CMD", "sh", "-c", "curl --fail --silent localhost:8083/actuator/health | grep UP || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      - postgres
      - eurekaserver
    networks:
      - swd392
    restart: on-failure


  chatbox:
    container_name: chatbox
    build:
      context: ../chatbox-service
    ports:
      - "8087:8087"
    environment:
      SPRING_APPLICATION_NAME: chatbox
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: chatAIDb
      DB_USERNAME: root
      DB_PASSWORD: root
      GEMINI_API_KEY: AIzaSyAcmMJeavWAS6k8BI3thSXQgH86jJatO80
    healthcheck:
      test: [ "CMD", "sh", "-c", "curl --fail --silent localhost:8087/actuator/health | grep UP || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      - postgres
      - eurekaserver
    networks:
      - swd392
    restart: on-failure

networks:
  swd392:
    external: true


