server:
  port: 8082
  servlet:
    context-path: /seminar

spring:
  application:
    name: seminar
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:seminarDb}
    driverClassName: org.postgresql.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create
    show-sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  cloud:
    discovery:
      enabled: true

  # config connection with rabbitMQ broker
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: guest
    password: guest

# config exchange for producer
rabbitmq:
  exchange: seminar.ticket-booked.direct.exchange
  routing-key: seminar.ticket-booked
  seminar-approved:
    exchange: seminar.approved.direct.exchange
    routing-key: seminar.approved

  # OpenAPI/Swagger Configuration
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    disable-swagger-default-url: true
  show-actuator: true
  packages-to-scan: org.swd392.seminars
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  writer-with-default-pretty-printer: true

# host url database: http://localhost:8080/h2-console


# config actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: "*"  # Expose all actuator endpoints over HTTP
  endpoint:
    shutdown:
      access: unrestricted  # Allow unrestricted access to the shutdown endpoint
      # NOTE: only use this shutdown endpoint config in dev env
  info:
    env:
      enabled: true         # show info env in /actuator/info


# config eureka client
eureka:
  instance:
    prefer-ip-address: true # Tells Eureka to use the IP address instead of the hostname when registering the service. Because there is no DNS locally or in Docker.
  client:
    fetch-registry: true # Tells eureka client to fetch the registry from the Eureka server
    register-with-eureka: true # tells eureka client to register itself with the Eureka server
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}  # URL of the Eureka server, this url can be hardcoded because it has only 1 Eureka server in the system


# info of Eureka client on the Eureka Server Dashboard
info:
  app:
    name: ${spring.application.name}
    description: "This is quiz service in Career Path Personality Assessment System"